<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zethu's Java project</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header-container">
      <div class="logo-container">
        <img src="./assets/xoxo-sticker.png" alt="XOXO logo" class="logo-img" />
      </div>

      <h1>WELCOME TO THE ULTIMATE GAME OF...</h1>
    </header>

    <main>
      <section id="intro">
        <div class="layout">
          <aside class="rules-container">
            <p class="rules-title">✨ THE RULES ✨</p>

            <div class="rule-box">
              <h3>Rule 1</h3>
              <p>Two-player game, so grab a partner and play!</p>
            </div>

            <div class="rule-box">
              <h3>Rule 2</h3>
              <p>Alternate placing X or O to get 3 in a row!</p>
            </div>

            <div class="rule-box">
              <h3>Rule 3</h3>
              <p>First to 3 wins. Full board = draw.</p>
            </div>
          </aside>

          <div class="main-content">
            <h2 class="intro">Tic-Tac-Toe</h2>

            <div class="players-container">
              <div class="player-card">
                <input type="text" placeholder="Enter name" />
                <h4>Player 1 (X)</h4>
              </div>

              <div class="player-card">
                <input type="text" placeholder="Enter name" />
                <h4>Player 2 (O)</h4>
              </div>
            </div>

            <div class="board">
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
